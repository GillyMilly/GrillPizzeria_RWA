<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registracija – GrillPizzeria API</title>
    <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
    <div class="login-container">
        <h1>Registracija</h1>
        <label for="username">Korisničko ime</label>
        <input type="text" id="username" placeholder="Korisničko ime" required />
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="E-mail" required />
        <label for="password">Lozinka</label>
        <input type="password" id="password" placeholder="Lozinka (min. 6 znakova)" required />
        <label for="ime">Ime</label>
        <input type="text" id="ime" placeholder="Ime" required />
        <label for="prezime">Prezime</label>
        <input type="text" id="prezime" placeholder="Prezime" required />
        <label for="mobitel">Mobitel (opcionalno)</label>
        <input type="text" id="mobitel" placeholder="Mobitel" />
        <button id="register-button" type="button">Registriraj se</button>
        <p><a href="login.html">Natrag na prijavu</a></p>
    </div>
    <script src="../js/register.js"></script>
</body>
</html>
